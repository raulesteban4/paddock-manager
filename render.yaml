# ==============================================================================
# Render.com Blueprint — Paddock Manager Infrastructure-as-Code
# ==============================================================================
# Despliegue automatizado con un solo clic:
#  1. Base de datos PostgreSQL 16 gestionada en la nube (Plan Free)
#  2. Backend REST API Spring Boot 3 (Multi-stage Docker)
#  3. Frontend Web Angular 18 con Nginx (Multi-stage Docker)
# ==============================================================================

databases:
  - name: paddock-db
    databaseName: paddock_db
    user: paddock_user
    plan: free
    region: frankfurt
    ipAllowList: [] # Permite conexiones internas directas desde servicios en Render

services:
  # ── 1. Backend REST API (Spring Boot 3) ──
  - type: web
    name: paddock-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: paddock-db
          property: connectionString
      - key: POSTGRES_USER
        fromDatabase:
          name: paddock-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: paddock-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: SWAGGER_ENABLED
        value: "true"

  # ── 2. Frontend Web SPA (Angular 18 + Nginx) ──
  - type: web
    name: paddock-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: paddock-api
          property: host
