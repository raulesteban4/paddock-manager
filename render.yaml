# ==============================================================================
# Render.com Blueprint — Paddock Manager Infrastructure-as-Code
# ==============================================================================
# Despliegue automatizado con un solo clic:
#  1. Base de datos PostgreSQL gestionada en la nube (Plan Free)
#  2. Backend REST API Spring Boot 3 (Multi-stage Docker)
#  3. Frontend Web Angular 18 con Nginx (Multi-stage Docker, PORT dinámico)
# ==============================================================================

databases:
  - name: paddock-db
    databaseName: paddock_db
    user: paddock_user
    plan: free
    region: frankfurt
    ipAllowList: [] # Permite conexiones internas desde servicios en Render

services:
  # ── 1. Backend REST API (Spring Boot 3) ──
  - type: web
    name: paddock-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Variables individuales de PostgreSQL — se usan directamente en la URL JDBC.
      # Render también auto-inyecta DATABASE_URL, pero la app NO la usa para
      # evitar el problema del prefijo jdbc: faltante.
      - key: POSTGRES_HOST
        fromDatabase:
          name: paddock-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: paddock-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: paddock-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: paddock-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: paddock-db
          property: password
      - key: HIKARI_MAX_POOL_SIZE
        value: "5"
      - key: HIKARI_MIN_IDLE
        value: "2"
      - key: JWT_SECRET
        generateValue: true
      - key: SWAGGER_ENABLED
        value: "true"

  # ── 2. Frontend Web SPA (Angular 18 + Nginx) ──
  - type: web
    name: paddock-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: BACKEND_URL
        value: "https://paddock-api-n1mp.onrender.com"
