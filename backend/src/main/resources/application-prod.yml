spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # URL construida exclusivamente con variables individuales de Render.
    # NO se usa DATABASE_URL para evitar que Render la inyecte automáticamente
    # como "postgresql://..." (sin prefijo jdbc:), lo que el driver JDBC rechaza.
    # Render inyecta POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER y
    # POSTGRES_PASSWORD de forma limpia desde fromDatabase en render.yaml.
    url: "jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:paddock_db}"
    username: ${POSTGRES_USER:paddock_user}
    password: ${POSTGRES_PASSWORD:paddock_secure_pass_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PaddockHikariCP-Prod
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 20000

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed.sql
      continue-on-error: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: never

logging:
  level:
    root: INFO
    com.paddock.manager: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
