services:
  # ── Base de Datos Relacional PostgreSQL 16 (Producción) ──
  postgres:
    image: postgres:16-alpine
    container_name: paddock-postgres-prod
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paddock-prod-network

  # ── Backend REST API Spring Boot 3 (Perfil Prod) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paddock-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
    networks:
      - paddock-prod-network

  # ── Frontend SPA Angular 18 con Nginx (Producción) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paddock-web-prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - paddock-prod-network

networks:
  paddock-prod-network:
    name: paddock_prod_network
    driver: bridge

volumes:
  postgres_prod_data:
    name: paddock_postgres_prod_data
