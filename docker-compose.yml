services:
  # ── Base de Datos Relacional PostgreSQL 16 ──
  postgres:
    image: postgres:16-alpine
    container_name: paddock-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paddock_db}
      POSTGRES_USER: ${POSTGRES_USER:-paddock_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paddock_secure_pass_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paddock_user} -d ${POSTGRES_DB:-paddock_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paddock-network

  # ── Backend REST API Spring Boot 3 ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paddock-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-paddock_db}
      POSTGRES_USER: ${POSTGRES_USER:-paddock_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paddock_secure_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - paddock-network

  # ── Frontend SPA Angular 18 con Nginx ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paddock-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - paddock-network

networks:
  paddock-network:
    name: paddock_network
    driver: bridge

volumes:
  postgres_data:
    name: paddock_postgres_data
